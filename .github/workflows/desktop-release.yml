name: Desktop Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew :composeApp:packageReleaseDmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: qadb-macos-dmg
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI, EXE and distributable app image
        run: .\gradlew.bat :composeApp:packageReleaseMsi :composeApp:packageReleaseExe :composeApp:createReleaseDistributable

      - name: Build ZIP portable package
        shell: pwsh
        run: |
          $appRoot = "composeApp/build/compose/binaries/main-release/app"
          $appDir = Get-ChildItem $appRoot -Directory | Select-Object -First 1
          if (-not $appDir) { throw "No app image directory found under $appRoot" }
          New-Item -ItemType Directory -Path "composeApp/build/compose/binaries/main-release/zip" -Force | Out-Null
          $zipPath = "composeApp/build/compose/binaries/main-release/zip/$($appDir.Name)-windows-portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$($appDir.FullName)/*" -DestinationPath $zipPath

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qadb-windows-installers
          path: |
            composeApp/build/compose/binaries/main-release/msi/*.msi
            composeApp/build/compose/binaries/main-release/exe/*.exe
            composeApp/build/compose/binaries/main-release/zip/*.zip
          if-no-files-found: error

  publish-release:
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: qadb-macos-dmg
          path: release-assets/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: qadb-windows-installers
          path: release-assets/windows

      - name: List release assets
        run: find release-assets -type f -print

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/macos/*.dmg
            release-assets/windows/msi/*.msi
            release-assets/windows/exe/*.exe
            release-assets/windows/zip/*.zip
